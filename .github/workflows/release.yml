name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-backend:
    name: Build ${{ matrix.target }}
    needs: release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use-cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use-cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            use-cross: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Binary
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            mkdir -p ~/.cargo/bin
            curl -L https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz | tar xz -C ~/.cargo/bin
            ~/.cargo/bin/cross build --release --target ${{ matrix.target }} --manifest-path src/server/Cargo.toml
          else
            cargo build --release --target ${{ matrix.target }} --manifest-path src/server/Cargo.toml
          fi

      - name: Package Binary
        shell: bash
        run: |
          mkdir -p build_output
          cp "src/server/target/${{ matrix.target }}/release/sidecar" "build_output/sidecar-${{ matrix.target }}"

      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v2
        with:
          files: build_output/sidecar-${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-frontend:
    name: Build and Upload Frontend
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: |
          cd src/webclient
          npm install

      - name: Build Frontend
        run: |
          cd src/webclient
          node scripts/build-js.js

      - name: Package Frontend
        run: |
          cd release
          zip -r ../admin.zip admin

      - name: Upload Frontend to Release
        uses: softprops/action-gh-release@v2
        with:
          files: admin.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
